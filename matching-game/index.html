<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Ninja Matching Game</title>

    <link href="style.css" rel="stylesheet" type="text/css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    >
  </head>

  <body>

    <main class="game-wrapper">

      <header>
        <div class="title-badge">MEMORY CHALLENGE</div>

        <h1>Ninja Matching Game</h1>

        <p class="subtitle">
          Find all six ninja pairs in as few flips as possible.
        </p>
      </header>

      <section id="game-container">

        <!-- This is where we display the flip and match counters -->
        <div id="ui-container">

          <div class="stat-box">
            <span class="stat-label">FLIPS</span>
            <span id="flip-count" class="stat-number">0</span>
          </div>

          <div class="stat-box">
            <span class="stat-label">MATCHES</span>

            <div class="match-number">
              <span id="match-count" class="stat-number">0</span>
              <span class="stat-total">/ 6</span>
            </div>
          </div>

        </div>

        <!-- This is where our cards will be rendered -->
        <div id="card-container">
        </div>

        <div id="win-message" class="win-message">
          <div class="win-icon">★</div>

          <h2>You mastered the dojo!</h2>

          <p>
            You found all six ninja pairs.
          </p>

          <button class="play-again-btn" onclick="resetGame()">
            Play Again
          </button>
        </div>

      </section>

      <div class="btn-container">
        <button class="reset-btn" onclick="resetGame()">
          ↻ Reset Game
        </button>
      </div>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.13.2/underscore-min.js"></script>
    <script src="https://bit.ly/3HbMbbF"></script>
    <script src="provided.js"></script>
    <script src="script.js"></script>

  </body>
</html>
